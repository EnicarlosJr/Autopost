server {
    listen 80;
    root /usr/share/nginx/html;

    # Arquivos com hash no nome podem ficar em cache; o index.html sempre é buscado de novo.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
